spring.application.name=votoverso
spring.main.banner-mode=off
# Cada evento de votação utiliza um ID próprio; nunca reusar um ID em nova eleição.
urna.eleicao.id=${URNA_ELEICAO_ID:votoverso-turma-01}
# Chave de professor/organizador apenas no servidor. Não publicar no GitHub.
urna.admin.key=${URNA_ADMIN_KEY:}

# Opcional: em geral o SDK encontra o projectId no JSON da conta de serviço.
urna.firebase.project-id=${FIREBASE_PROJECT_ID:}
